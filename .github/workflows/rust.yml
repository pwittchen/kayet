name: Rust

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails the build on any known vulnerability in npm or Cargo dependencies. cargo audit also
  # denies warnings (unmaintained / unsound / yanked crates); exceptions live in .cargo/audit.toml.
  audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Audit npm dependencies
      run: npm audit

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    - name: Audit Cargo dependencies
      run: cargo audit --deny warnings

  build:

    # Apple Silicon and Intel (SPEC.md §3): checks run natively on the Apple Silicon runner,
    # the Intel app is cross-compiled there too.
    runs-on: macos-15
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    env:
      TARGET: ${{ matrix.arch }}-apple-darwin

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    # Installs the toolchain pinned in rust-toolchain.toml, so CI lints match local ones.
    - name: Install Rust toolchain
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.arch }}

    - name: Install frontend dependencies
      run: npm ci

    # The Rust crate embeds dist/ at compile time, so the frontend must be built first.
    - name: Build frontend
      run: npm run build

    - name: Run frontend tests
      if: matrix.arch == 'aarch64'
      run: npm test

    - name: Check formatting
      if: matrix.arch == 'aarch64'
      run: cargo fmt --check

    - name: Lint
      if: matrix.arch == 'aarch64'
      run: cargo clippy --locked --all-targets -- -D warnings -W clippy::pedantic

    - name: Build
      if: matrix.arch == 'aarch64'
      run: cargo build --locked

    - name: Run tests
      if: matrix.arch == 'aarch64'
      run: cargo test --locked

    - name: Bundle app
      run: npx tauri build --target "$TARGET" --bundles app

    - name: Package app
      run: |
        cd "target/$TARGET/release/bundle/macos"
        ditto -c -k --keepParent kayet.app "$GITHUB_WORKSPACE/kayet-macos-${{ matrix.arch }}.zip"

    - uses: actions/upload-artifact@v7
      with:
        name: kayet-macos-${{ matrix.arch }}
        path: kayet-macos-${{ matrix.arch }}.zip
        if-no-files-found: error
