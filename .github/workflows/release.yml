name: Release

# Pushing a `vX.Y.Z` tag builds kayet for Apple Silicon and Intel, signs both with the Developer
# ID, notarizes them with notarytool and publishes a .dmg per architecture to GitHub Releases,
# then redeploys the website so its version pill matches. Regular pushes (rust.yml) stay unsigned.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version-bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Bump version to the tag if needed
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not in the vX.Y.Z format"
            exit 1
          fi
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' core/Cargo.toml | head -n 1)
          echo "current version: $current, tag version: $version"
          export VERSION="$version"
          # core/Cargo.toml: the first `version =` line is the [package] one.
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' core/Cargo.toml
          perl -0pi -e 's/(\nname = "kayet"\nversion = ")[^"]*/$1$ENV{VERSION}/' Cargo.lock
          # Tauri reads its own `version` (Info.plist CFBundleShortVersionString) from tauri.conf.json.
          perl -0pi -e 's/^(  "version": ")[^"]*/$1$ENV{VERSION}/m' core/tauri.conf.json package.json
          perl -0pi -e 's/("name": "kayet",\s*"version": ")[^"]*/$1$ENV{VERSION}/g' package-lock.json
          # website/index.html: the version pill in the hero (label and release link).
          perl -pi -e 's/v\d+\.\d+\.\d+/v$ENV{VERSION}/g if /class="version-pill"/' website/index.html
          if git diff --quiet; then
            echo "version is already $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core/Cargo.toml Cargo.lock core/tauri.conf.json package.json package-lock.json website/index.html
          git commit -m "bump version to $version"
          git push origin HEAD:master

  build:
    needs: version-bump
    # Apple Silicon and Intel (SPEC.md §3); the Intel app is cross-compiled on the Apple Silicon
    # runner. Built against the macOS 26 SDK: AppKit's title bar button layout is
    # linked-on-or-after gated, so an older SDK would misplace the traffic lights
    # (trafficLightPosition in tauri.conf.json) on current macOS.
    runs-on: macos-26
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    env:
      TARGET: ${{ matrix.arch }}-apple-darwin
      DMG: kayet-macos-${{ matrix.arch }}.dmg
    steps:
      - uses: actions/checkout@v7
        with:
          # master carries the version bump committed by the previous job
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # rust-toolchain.toml lists both targets.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci

      # beforeBuildCommand builds the frontend into dist/ before the crate embeds it.
      - name: Build app
        run: npx tauri build --target "$TARGET" --bundles app

      - name: Import Developer ID certificate
        # Imports the base64-encoded .p12 into a one-shot keychain; removed in the last step.
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[" ]//g')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign app
        # Hardened runtime + secure timestamp are required for notarization.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app="target/$TARGET/release/bundle/macos/kayet.app"
          codesign --force --deep --options runtime --timestamp \
            --entitlements core/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Notarize and staple app
        # notarytool accepts zip / dmg / pkg, so the .app is submitted as a zip. Stapling the
        # ticket lets Gatekeeper accept the app offline once it is copied out of the .dmg.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="target/$TARGET/release/bundle/macos/kayet.app"
          zip="$RUNNER_TEMP/kayet-notarize.zip"
          ditto -c -k --keepParent "$app" "$zip"
          xcrun notarytool submit "$zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

      - name: Package dmg
        # Built with hdiutil (not Tauri's dmg bundler) so it contains the signed, stapled app.
        run: |
          staging=$(mktemp -d)
          cp -R "target/$TARGET/release/bundle/macos/kayet.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          # hdiutil occasionally fails with "Resource busy" on GitHub runners, so retry.
          for attempt in 1 2 3; do
            hdiutil detach /Volumes/kayet -force 2>/dev/null || true
            if hdiutil create -volname kayet -srcfolder "$staging" -ov -format UDZO "$DMG"; then
              exit 0
            fi
            echo "::warning::hdiutil create failed (attempt $attempt), retrying in 5s"
            sleep 5
          done
          exit 1

      - name: Sign dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          codesign --verify --verbose=2 "$DMG"

      - name: Notarize and staple dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/devid.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: kayet-macos-*.dmg
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          previous_tag=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n 1)
          range="$GITHUB_REF_NAME"
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$GITHUB_REF_NAME"
          fi
          log=$(git log --pretty=format:'- %s (%h)' "$range" | grep -v '^- bump version to ' || true)
          {
            echo 'body<<EOF'
            echo "$log"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: kayet-macos-aarch64.dmg
          fail_on_unmatched_files: true

      # Uploaded after the Apple Silicon .dmg on purpose: versions before Intel builds update
      # from the first .dmg asset of a release, and assets are listed in upload order.
      - name: Upload Intel dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" kayet-macos-x86_64.dmg

  deploy-website:
    # The bump commit is pushed with GITHUB_TOKEN, which doesn't trigger deploy-website.yml on
    # its own, so call it explicitly once the release (and its .dmg) is published.
    needs: release
    uses: ./.github/workflows/deploy-website.yml
    secrets: inherit
