name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - 'website/**'

  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    # A `#no-deploy` hashtag in a commit pushed to a branch skips the deploy. Tag pushes (the
    # release workflow calls this one) always deploy.
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && contains(github.event.head_commit.message, '#no-deploy')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build website
        run: cd website && bun install && bun run build

      - name: Deploy to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: website/dist/
          remote_path: /var/www/getkayet/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT }}
