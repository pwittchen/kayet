<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kayet</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" hidden>
        <div id="tree" tabindex="0" aria-label="Files"></div>
      </aside>
      <div id="sidebar-divider" class="divider" hidden></div>

      <main id="editor-pane">
        <div id="banner" role="alert" hidden>
          <span>File changed on disk</span>
          <span class="sep">—</span>
          <button id="banner-reload" type="button">Reload</button>
          <span class="sep">/</span>
          <button id="banner-keep" type="button">Keep mine</button>
        </div>
        <div id="editor"></div>
      </main>

      <div id="preview-divider" class="divider" hidden></div>
      <section id="preview-pane" hidden>
        <article id="preview" class="markdown-body"></article>
      </section>
    </div>

    <header id="titlebar" data-tauri-drag-region>
      <nav class="controls controls-left">
        <button id="btn-sidebar" type="button" title="Toggle file tree (⌘\)" aria-label="Toggle file tree"></button>
      </nav>
      <div id="tabs" role="tablist" aria-label="Open documents" data-tauri-drag-region hidden></div>
      <div id="doc-title" data-tauri-drag-region>
        <span id="doc-name" data-tauri-drag-region></span>
        <span id="doc-edited" data-tauri-drag-region hidden>— edited</span>
        <span id="doc-stats" data-tauri-drag-region hidden></span>
      </div>
      <nav class="controls">
        <button id="btn-status" type="button" hidden></button>
        <button id="btn-close-file" type="button" title="Close file" aria-label="Close file" hidden></button>
        <button id="btn-new-tab" type="button" title="New tab (⌘T)" aria-label="New tab"></button>
        <button id="btn-palette" type="button" title="Command palette (⌘K)" aria-label="Command palette"></button>
        <button id="btn-recent" type="button" title="Open recent" aria-label="Open recent"></button>
        <button id="btn-pin" type="button" title="Keep title bar visible (⌘.)" aria-label="Keep title bar visible" aria-pressed="false"></button>
        <button id="btn-zen" type="button" title="Zen mode (⌘⇧J)" aria-label="Zen mode" aria-pressed="false"></button>
        <button id="btn-code" type="button" title="Code editor mode" aria-label="Code editor mode" aria-pressed="false"></button>
        <button id="btn-blink" type="button" aria-label="Cursor blink" aria-pressed="true"></button>
        <button id="btn-workspace" type="button" title="Change workspace (⌘⇧O)" aria-label="Change workspace"></button>
        <button id="btn-syntax" type="button" title="Syntax highlighting" aria-label="Syntax highlighting" aria-pressed="false" hidden></button>
        <button id="btn-spell" type="button" aria-label="Spell check" aria-pressed="false" hidden></button>
        <button id="btn-settings" type="button" title="Settings (⌘,)" aria-label="Settings"></button>
        <button id="btn-theme" type="button" aria-label="Cycle theme"></button>
        <button id="btn-preview" type="button" title="Toggle preview (⌘⇧P)" aria-label="Toggle preview" hidden></button>
      </nav>
    </header>

    <button id="edge-handle" type="button" title="Show file tree (⌘\)" aria-label="Show file tree"></button>
    <div id="toast" role="status" hidden></div>
    <div id="print" aria-hidden="true"></div>
  </body>
</html>
