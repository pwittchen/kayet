[package]
name = "kayet"
version = "0.7.1"
edition = "2024"
description = "A minimalistic text editor for macOS"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
notify = "8"
trash = "5"
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSAttributedString", "NSImage", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSData", "NSDictionary", "NSObject", "NSString", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[dev-dependencies]
tempfile = "3"
