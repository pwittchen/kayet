# gruvbox for kayet.
# Source of truth for the colors: https://github.com/morhetz/gruvbox/blob/master/colors/gruvbox.vim
# Roles follow upstream (blue links) and VS Code's gruvbox port (aqua selection).
# Bundled with kayet: set `theme = "gruvbox"` in ~/.kayet/config.toml or pick it from
# `Switch Theme…`. A copy in ~/.kayet/themes/gruvbox.toml takes precedence.
# Either section may be left out: a single-variant theme is always shown in that variant.
# See SPEC.md §9 for the format.

[dark]
bg = "#282828"
bg-sidebar = "#1d2021"
text = "#ebdbb2"
text-muted = "#928374"
border = "#3c3836"
accent = "#83a598"
selection = "#689d6a40"
caret = "#ebdbb2"
hl-keyword = "#fb4934"
hl-string = "#b8bb26"
hl-number = "#d3869b"
hl-title = "#fabd2f"
hl-comment = "#928374"

[light]
bg = "#fbf1c7"
bg-sidebar = "#ebdbb2"
text = "#3c3836"
text-muted = "#928374"
border = "#d5c4a1"
accent = "#076678"
selection = "#689d6a40"
caret = "#3c3836"
hl-keyword = "#9d0006"
hl-string = "#79740e"
hl-number = "#8f3f71"
hl-title = "#b57614"
hl-comment = "#928374"
