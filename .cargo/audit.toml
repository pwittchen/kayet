# cargo audit configuration
#
# The advisories below affect only Linux-only transitive dependencies of Tauri
# (GTK / WebKitGTK bindings and the D-Bus stack). They are not compiled into the
# macOS app, and no patched versions exist until Tauri moves to gtk-rs >= 0.19
# and zbus >= 6. Revisit when upgrading Tauri.

[advisories]
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained (via glib-macros 0.18)
    "RUSTSEC-2024-0429", # glib 0.18 VariantStrIter unsoundness (via gtk 0.18)
    "RUSTSEC-2026-0370", # zvariant unmaintained, merged into zbus 6 (via tauri-plugin-opener)
    "RUSTSEC-2026-0371", # zbus_names unmaintained, merged into zbus 6
    "RUSTSEC-2026-0372", # zvariant_derive unmaintained, merged into zbus 6
]
